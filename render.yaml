services:

  # Backend — FastAPI
  - type: web
    name: remind-backend
    runtime: python
    rootDir: backend_final
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: remind-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REDIS_URL
        value: ""
      - key: REACT_BASE_URL
        value: "https://remind-frontend.onrender.com"
      - key: REACT_BASE_URL_ALTERNATIVE
        value: "http://localhost:3000"
      - key: GOOGLE_CLIENT_ID
        value: ""          # Add your Google client ID
      - key: GOOGLE_CLIENT_SECRET
        value: ""          # Add your Google client secret
      - key: GROQ_API_KEY
        value: ""          # Add your Groq API key
      - key: CLOUDINARY_URL
        value: ""
      - key: CLOUDINARY_CLOUD_NAME
        value: ""
      - key: CLOUDINARY_API_KEY
        value: ""
      - key: CLOUDINARY_API_SECRET
        value: ""
      - key: ELEVENLABS_API_KEY
        value: ""          # Add your ElevenLabs key
      - key: AI_IMAGE_PATH
        value: ""
      - key: AI_TEXT_PATH
        value: ""
      - key: AI_VOICE_PATH
        value: ""
      - key: UPLOAD_DIR
        value: uploads/

  # Frontend — React (CRA Static Site)
  - type: web
    name: remind-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    plan: free
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: ""          # Fill in after backend deploys (https://remind-backend.onrender.com)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: remind-db
    databaseName: remind
    user: remind_user
    plan: free

